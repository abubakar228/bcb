name: Sync Beer City reference assets
on:
  push:
    paths:
      - '.sync-reference-assets'
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact reference assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base='https://beercitybilliards.com/wp-content/uploads'
          curl -L --fail --retry 3 "$base/2024/12/BCB-logo-768x599.png" -o assets/bcb-src-logo-768x599.png
          curl -L --fail --retry 3 "$base/2024/12/BCB-logo-1024x798.png" -o assets/bcb-src-logo-1024x798.png
          curl -L --fail --retry 3 "$base/2024/12/BCB-logo-1024x798.webp" -o assets/bcb-src-logo-cru5h.webp
          curl -L --fail --retry 3 "$base/2024/12/BCB-logo-1-1024x798.webp" -o assets/bcb-src-logo-taom.webp
          curl -L --fail --retry 3 "$base/2026/09/Coinfinity_logo_optimized_100.png" -o assets/bcb-src-logo-coinfinity.png
          curl -L --fail --retry 3 "$base/2025/11/Billiards-Accessories-1.webp" -o assets/bcb-src-hero.webp
          curl -L --fail --retry 3 "$base/2025/08/Add-Variants.webp" -o assets/bcb-src-coin-feature.webp
          curl -L --fail --retry 3 "$base/2026/09/dasasdqwdsfe_optimized_100.webp" -o assets/bcb-src-taom-promo.webp
          curl -L --fail --retry 3 "$base/2026/04/Table-Repairing-Service-In-Michigan.webp" -o assets/bcb-src-table-service.webp
          curl -L --fail --retry 3 "$base/2026/04/Wholesale-Billiards-Accessories-In-Michigan.webp" -o assets/bcb-src-wholesale.webp
      - name: Commit local assets
        shell: bash
        run: |
          rm -f .sync-reference-assets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add exact Beer City reference assets'
          git push